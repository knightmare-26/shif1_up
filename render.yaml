services:
  - type: web
    name: shif1-up-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DUCKDB_PATH
        value: /app/data/f1_history.duckdb
      - key: FASTF1_CACHE_DIR
        value: /app/data/fastf1_cache
      - key: MODEL_DIR
        value: /app/data/models
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONPATH
        value: /app/api
      # Secrets — set these manually in the Render dashboard, never committed
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Set to your Render static site URL once deployed
      # e.g. https://shif1-up-frontend.onrender.com
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: shif1-up-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      # Set to your Render API URL once the backend is deployed
      # e.g. https://shif1-up-api.onrender.com
      - key: REACT_APP_API_URL
        sync: false
