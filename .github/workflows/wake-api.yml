# Wake the API when there's new data to pick up (sessions just run, and every 6 hours), so the site
# keeps itself current without anyone opening it. Render's free server sleeps between visits, and its
# data upkeep only runs while it's awake (it catches up the moment it starts). scripts/wake_api.py
# decides from the F1 calendar; most runs end in seconds without waking anything. Free: public repo.
#
# Needs the repository secret API_URL (the API's address). Not CI — that's still shelved.
name: Wake the API

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"     # every 10 minutes, off the busy top of the hour
  workflow_dispatch:

permissions:
  actions: write      # the keep-alive step below
  contents: read

concurrency:
  group: wake-api
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/wake_api.py
          sparse-checkout-cone-mode: false

      - name: Wake the API if there's data to pick up
        env:
          API_URL: ${{ secrets.API_URL }}
        run: python3 scripts/wake_api.py

      # GitHub switches off a public repository's scheduled workflows after 60 days without activity
      # (the off-season). Re-enabling this one every Monday keeps it on; if it ever is switched off,
      # GitHub emails first, and Actions -> "Wake the API" -> Enable workflow turns it back on.
      - name: Keep the schedule on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u%H)" = "100" ] && [ "$(date -u +%M)" -lt 10 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/wake-api.yml/enable"
            echo "Schedule kept on."
          fi
